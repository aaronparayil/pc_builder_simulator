<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rig Builder: 3D PC Building Simulator</title>
    <meta name="description" content="Build a gaming PC part by part in 3D. Pick components, catch compatibility mistakes, stay on budget and benchmark your rig in the browser." />
    <meta name="theme-color" content="#07080c" />
    <meta property="og:title" content="Rig Builder: 3D PC Building Simulator" />
    <meta property="og:description" content="Build a PC part by part in 3D, then power it on and benchmark it." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235eead4' stroke-width='2'%3E%3Crect x='6' y='6' width='12' height='12' rx='1.5'/%3E%3Cpath d='M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="viewport" aria-label="3D workshop. Drag to orbit, scroll to zoom." role="img"></div>

      <header id="topbar">
        <button class="brand" id="btn-home" aria-label="Back to menu">RIG<span>//</span>BUILDER</button>
        <div id="mode-pill" class="pill" hidden></div>
        <div class="top-actions">
          <button class="btn small walk-btn" id="btn-walk"></button>
          <button class="icon-btn" id="btn-compare" title="Compare CPUs and GPUs (C)" aria-label="Compare parts"></button>
          <span id="vr-slot"></span>
          <button class="icon-btn" id="btn-view" title="Reset camera (R)" aria-label="Reset camera"></button>
          <button class="icon-btn" id="btn-sound" title="Sound" aria-label="Toggle sound"></button>
          <button class="icon-btn" id="btn-help" title="How to play (?)" aria-label="How to play"></button>
        </div>
      </header>

      <aside id="build-panel" class="panel" aria-label="Your build">
        <div class="panel-head">
          <h2>Your build</h2>
          <span id="build-count" class="muted mono"></span>
        </div>
        <ol id="checklist"></ol>
        <div id="issues" aria-live="polite"></div>
        <div id="meters"></div>
        <div class="secondary-row">
          <button id="btn-share" class="btn ghost small"></button>
          <button id="btn-clear" class="btn ghost small"></button>
        </div>
        <div class="power-row">
          <button id="btn-power" class="btn primary"><span class="ico"></span><span class="label">Power on</span></button>
        </div>
      </aside>

      <aside id="catalog-panel" class="panel" aria-label="Parts catalog">
        <div class="panel-head">
          <div>
            <p class="eyebrow mono" id="cat-step"></p>
            <h2 id="cat-title"></h2>
          </div>
        </div>
        <p id="cat-hint" class="muted"></p>
        <div id="cat-note"></div>
        <div id="cat-list" role="list"></div>
      </aside>

      <nav id="mobile-tabs" aria-label="Panels">
        <button data-sheet="build">Build</button>
        <button data-sheet="parts">Parts</button>
      </nav>

      <div id="tooltip" role="tooltip"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="drop-hint">Drop to install</div>

      <div id="crosshair" aria-hidden="true"></div>
      <div id="walk-prompt" role="status" aria-live="polite"></div>
      <div id="walk-hint" class="mono"></div>
      <div id="walk-overlay">
        <div class="walk-card">
          <p class="eyebrow mono">Showroom</p>
          <h2>Click to look around</h2>
          <div class="keys">
            <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</div><div><kbd>Mouse</kbd> look</div>
            <div><kbd>Shift</kbd> run</div><div><kbd>E</kbd> interact</div>
          </div>
          <p class="muted small">Browse the display cases, read the posters, try the compare kiosk. Press <kbd>Esc</kbd> to free the mouse.</p>
          <button class="btn ghost small" data-exit-walk>Back to the bench</button>
        </div>
      </div>
    </div>

    <div id="loader">
      <div class="loader-inner">
        <div class="brand big">RIG<span>//</span>BUILDER</div>
        <div class="bar"><div id="loader-fill"></div></div>
        <p class="mono muted" id="loader-text">Unpacking parts…</p>
      </div>
    </div>

    <dialog id="start-dialog" aria-labelledby="start-title"></dialog>
    <dialog id="result-dialog" aria-labelledby="result-title"></dialog>
    <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
    <dialog id="showcase-dialog" aria-labelledby="showcase-title"></dialog>
    <dialog id="compare-dialog" aria-labelledby="compare-title"></dialog>
    <dialog id="poster-dialog" aria-labelledby="poster-title"></dialog>

    <noscript>Rig Builder needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
